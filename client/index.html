<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Quiz Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    /* ── Join screen ─────────────────────────────── */
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    #join-screen h1 {
      font-size: 2.4rem;
      color: #e94560;
      text-shadow: 0 0 20px rgba(233,69,96,.4);
    }
    #join-screen input {
      font-size: 1.2rem;
      padding: 10px 16px;
      border-radius: 8px;
      border: 2px solid #e94560;
      background: #16213e;
      color: #eee;
      width: 260px;
      text-align: center;
      outline: none;
    }
    #join-screen button {
      font-size: 1.1rem;
      padding: 10px 32px;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background .2s;
    }
    #join-screen button:hover { background: #c73650; }

    /* ── Game container ───────────────────────────── */
    #game-container { display: none; position: relative; }
    #game-container.active { display: block; }

    /* ── HUD overlay ─────────────────────────────── */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      font-size: .9rem;
      pointer-events: none;
    }
    #mute-btn, #chat-btn, #share-btn {
      pointer-events: auto;
      background: none;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 6px;
      color: #fff;
      font-size: 1.1rem;
      padding: 4px 8px;
      cursor: pointer;
      transition: border-color .2s;
    }
    #mute-btn:hover, #chat-btn:hover, #share-btn:hover { border-color: #fff; }
    #hud .phase {
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .phase-lobby    { background: #0f3460; }
    .phase-inQuestion { background: #e94560; }
    .phase-revealed { background: #16c79a; }

    /* ── Question overlay ─────────────────────────── */
    #question-overlay {
      display: none;
      position: fixed;
      bottom: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(6px);
      border: 1px solid #e94560;
      border-radius: 12px;
      padding: 12px 20px;
      max-width: 500px;
      width: 90%;
      text-align: center;
    }
    #question-overlay.active { display: block; }
    #question-overlay h2 { font-size: 1.1rem; margin-bottom: 8px; }
    #question-overlay .options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: .9rem; }
    #question-overlay .opt { padding: 6px; border-radius: 6px; }
    .opt-A { background: #e94560; }
    .opt-B { background: #0f3460; }
    .opt-C { background: #e9a045; }
    .opt-D { background: #16c79a; }
    #timer { font-size: 1.4rem; font-weight: bold; margin-top: 6px; }

    /* ── Chat bar (top, under HUD) ───────────────── */
    #chat-bar {
      display: none;
      position: fixed;
      top: 46px; left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(380px, 88vw);
    }
    #chat-bar.active { display: flex; }
    #chat-input {
      flex: 1;
      padding: 7px 12px;
      border-radius: 8px;
      border: 2px solid #e94560;
      background: rgba(0,0,0,.82);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: .9rem;
      outline: none;
    }
    #chat-input::placeholder { color: rgba(255,255,255,.4); }

    /* ── QR modal ────────────────────────────────── */
    #qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,.7);
      align-items: center;
      justify-content: center;
    }
    #qr-modal.active { display: flex; }
    #qr-inner {
      background: #16213e;
      border: 1px solid #e94560;
      border-radius: 14px;
      padding: 24px 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #qr-inner h3 { color: #e94560; margin: 0; font-size: 1.1rem; }
    #qr-canvas { border-radius: 8px; }
    #qr-url {
      font-size: .75rem;
      color: #aaa;
      word-break: break-all;
      max-width: 220px;
    }
    #qr-close {
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #0f3460;
      color: #fff;
      cursor: pointer;
      font-size: .9rem;
    }
    #qr-close:hover { background: #1a4a80; }

    /* ── Touch controls overlay ─────────────── */
    #touch-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      touch-action: none;
    }
    #joy-base-html {
      position: fixed;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.35);
      pointer-events: none;
      transform: translate(0,0); /* will be positioned by JS */
    }
    #joy-stick-html {
      position: fixed;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      pointer-events: none;
    }
    #jump-btn-html {
      position: fixed;
      right: 24px; bottom: 48px;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: rgba(255,215,0,0.4);
      border: 2px solid rgba(255,215,0,0.7);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #jump-btn-html.pressed {
      background: rgba(255,215,0,0.8);
    }
  </style>
</head>
<body>
  <!-- Join screen -->
  <div id="join-screen">
    <h1>Quiz Arena</h1>
    <input id="nickname-input" type="text" maxlength="16" placeholder="Enter nickname" autofocus />
    <button id="join-btn">Join Game</button>
  </div>

  <!-- Game area -->
  <div id="game-container">
    <!-- HUD -->
    <div id="hud">
      <span id="phase-badge" class="phase phase-lobby">LOBBY</span>
      <span id="player-count">Players: 0</span>
      <div style="display:flex;gap:6px">
        <button id="chat-btn"  title="Chat (Enter / T)">💬</button>
        <button id="mute-btn"  title="Toggle sound (M)">🔊</button>
        <button id="share-btn" title="Share QR code">📱</button>
      </div>
    </div>

    <!-- Chat bar (top, under HUD) -->
    <div id="chat-bar">
      <input id="chat-input" type="text" maxlength="60" placeholder="Say something… Enter to send, Esc to close" autocomplete="off" />
    </div>

    <!-- QR share modal -->
    <div id="qr-modal">
      <div id="qr-inner">
        <h3>📱 Scan to join</h3>
        <canvas id="qr-canvas"></canvas>
        <p id="qr-url"></p>
        <button id="qr-close">✕ Close</button>
      </div>
    </div>

    <!-- Touch controls overlay (shown on first touch) -->
    <div id="touch-overlay">
      <div id="joy-base-html"></div>
      <div id="joy-stick-html"></div>
      <button id="jump-btn-html">▲</button>
    </div>

    <!-- Question overlay -->
    <div id="question-overlay">
      <h2 id="q-text"></h2>
      <div class="options">
        <div class="opt opt-A" id="opt-A"></div>
        <div class="opt opt-B" id="opt-B"></div>
        <div class="opt opt-C" id="opt-C"></div>
        <div class="opt opt-D" id="opt-D"></div>
      </div>
      <div id="timer"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
